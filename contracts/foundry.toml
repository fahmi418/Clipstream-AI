[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "shanghai"

[profile.default.fuzz]
runs = 10000
max_test_rejects = 65536
seed = "0x42"

[profile.default.invariant]
runs = 256
depth = 15
fail_on_revert = false

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true

[rpc_endpoints]
opbnb_testnet = "${OPBNB_RPC_URL}"
opbnb_fallback = "${OPBNB_RPC_FALLBACK}"
